<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>For You ❤️</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="stars"></div>
<div id="fireflies"></div>

<section id="intro" class="screen active">
  <div class="intro-box">
    <div id="typing">I Have Something</div>
    <button id="openBtn"><span>✦</span> Open</button>
  </div>
</section>

<section id="garden" class="screen">
  <div class="top-title" id="title"></div>
  <div class="subtitle" id="subtitle"></div>

  <div class="garden">
    <div class="ground-glow"></div>

    <div class="flower flower1">
      <div class="stem"></div><div class="leaf leaf-a"></div><div class="leaf leaf-b"></div>
      <div class="head white"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><b></b></div>
    </div>

    <div class="flower flower2">
      <div class="stem"></div><div class="leaf leaf-a"></div><div class="leaf leaf-b"></div>
      <div class="head pink"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><b></b></div>
    </div>

    <div class="flower flower3">
      <div class="stem"></div><div class="leaf leaf-a"></div><div class="leaf leaf-b"></div>
      <div class="head white big"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><b></b></div>
    </div>

    <div class="flower flower4">
      <div class="stem"></div><div class="leaf leaf-a"></div><div class="leaf leaf-b"></div>
      <div class="head pink"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><b></b></div>
    </div>

    <div class="flower flower5">
      <div class="stem"></div><div class="leaf leaf-a"></div><div class="leaf leaf-b"></div>
      <div class="head white"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><b></b></div>
    </div>

    <div class="flower flower6">
      <div class="stem"></div><div class="leaf leaf-a"></div><div class="leaf leaf-b"></div>
      <div class="head pink"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><b></b></div>
    </div>

    <div class="flower flower7">
      <div class="stem"></div><div class="leaf leaf-a"></div><div class="leaf leaf-b"></div>
      <div class="head white"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><b></b></div>
    </div>

    <div class="grass g1"></div><div class="grass g2"></div><div class="grass g3"></div>
    <div class="grass g4"></div><div class="grass g5"></div><div class="grass g6"></div>
  </div>

  <div id="loveMessage" class="love-message">
    <div class="line"></div>
    <div class="love-text">You are my favorite person</div>
    <div class="big-heart">♥</div>
    <div class="small-text">Made with love, just for you</div>
  </div>
</section>

<script src="script.js"></script>
</body>
</html>
